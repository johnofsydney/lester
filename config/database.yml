# config/database.yml

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch('DEV_DATABASE_NAME', 'lester_development') %> # can set db in env - useful for worktrees

test:
  <<: *default
  database: <%= ENV.fetch('TEST_DATABASE_NAME', 'lester_test') %>

staging:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
