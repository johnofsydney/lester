:concurrency: 5
:queues:
  - [critical, 10]
  - [default, 2]
  - [low, 1]
  - [aus_tender_contracts, 1]

# cron_tab is in UTC, converting to AEST
# UTC 01:00 == AEST 11:00
# UTC 02:00 == AEST 12:00
# UTC 03:00 == AEST 13:00
# UTC 04:00 == AEST 14:00
# UTC 05:00 == AEST 15:00
# UTC 06:00 == AEST 16:00
# UTC 07:00 == AEST 17:00
# UTC 08:00 == AEST 18:00
# UTC 09:00 == AEST 19:00
# UTC 10:00 == AEST 20:00
# UTC 11:00 == AEST 21:00
# UTC 12:00 == AEST 22:00
# UTC 13:00 == AEST 23:00
# UTC 14:00 == AEST 00:00 (next day)
# UTC 15:00 == AEST 01:00 (next day)
# UTC 16:00 == AEST 02:00 (next day)
# UTC 17:00 == AEST 03:00 (next day)
# UTC 18:00 == AEST 04:00 (next day)
# UTC 19:00 == AEST 05:00 (next day)
# UTC 20:00 == AEST 06:00 (next day)
# UTC 21:00 == AEST 07:00 (next day)
# UTC 22:00 == AEST 08:00 (next day)
# UTC 23:00 == AEST 09:00 (next day)
# UTC 00:00 == AEST 10:00 (next day)

# MINUTE - HOUR - DAY - MONTH - WEEKDAY

:scheduler:
  :schedule:
    # Every year fetch all ACNC listed charities organisations (CSV Download)
    ingest_charities_dataset_csv_job:
      cron: '0 14 1 3 *' # Every year on March 1st at midnight
      class: Acnc::IngestDatasetCsvJob
    # Every year fetch all people belonging to ACNC listed charities
    ingest_charities_people_job:
      cron: '0 14 2 3 *' # Every year on March 2nd at midnight
      class: Acnc::IngestPeopleJob
    # Twice per year fetch all Federal Lobbyists (CSV Download)
    ingest_lobbyists_job:
      cron: '0 14 1 4,10 *' # Every year on April 1st and October 1st at midnight
      class: AuLobbyists::IngestLobbyistsJob
    backfill_contracts_master_job:
      cron: '0 13 2 * *' # On the 2nd of Every Month, at 23:00
      class: AusTender::BackfillContractsMasterJob
    # Every day fetch all AusTender contracts
    ingest_contracts_date:
      cron: '0 16 * * *' # Every day ay 2am
      class: AusTender::IngestContractsDateJob
    # Every day handle any Transfers that are 0 amount
    handle_zero_value_transfers:
      cron: '0 17 * * *' # Every day ay 3am
      class: Transfers::HandleZeroValueTransfersJob
    # Every day run the RefreshNodesCountJob
    refresh_nodes_count_job:
      cron: '15 * * * *' # Every hour at 15 mins past the hour
      class: Cache::RefreshNodesCountJob
    # Every month re-run NSW council election ingestion -- idempotent, catches any
    # wards that hadn't declared yet on a previous run. Currently hardcoded to the
    # LG2401 (2024) cycle -- see context/2026-08-12-council-ingestion-production-readiness-goal-3.md
    ingest_nsw_council_election_results_job:
      cron: '0 13 3 * *' # On the 3rd of every month, at 23:00 AEST
      class: Councils::Nsw::IngestElectionResultsJob
    # Every month re-run VIC council election ingestion -- same rationale as NSW above.
    # Currently hardcoded to the 2024 cycle.
    ingest_vic_council_election_results_job:
      cron: '0 13 4 * *' # On the 4th of every month, at 23:00 AEST
      class: Councils::Vic::IngestElectionResultsJob
    # Every month, re-fetch the current OpenAustralia roster and re-ingest each politician
    # (each per-person ingest also re-runs Interpretation, so this both discovers new
    # politicians and refreshes/closes terms for already-known ones still on the roster)
    # Cron day is 4, not 5: per the conversion table above, hour 14 UTC rolls into the
    # *next* AEST day, so day 4 is what actually lands at 00:00 AEST on the 5th.
    ingest_current_politicians_job:
      cron: '0 14 4 * *' # Every month on the 5th at midnight AEST
      class: OpenAustralia::IngestCurrentPoliticiansJob
